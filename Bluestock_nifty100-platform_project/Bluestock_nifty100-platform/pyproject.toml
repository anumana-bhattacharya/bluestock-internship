[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty100-financial-intelligence"
version = "1.0.0"
description = "Registry-driven Nifty100 financial analytics platform"
requires-python = ">=3.10"

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=src --cov-report=term-missing --cov-report=html:htmlcov"

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
  "src/dashboard/app.py",
  "src/orchestration/run_all.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
